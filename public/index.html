<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xray Panel v7</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#0b1020;color:#e9eefb}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:9px 13px;background:#334155;color:white}.primary{background:#2563eb}.danger{background:#b91c1c}.ok{background:#15803d}.wrap{max-width:1250px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{background:#121a2d;border:1px solid #263452;border-radius:14px;padding:15px;margin-bottom:14px}.stat{font-size:28px;font-weight:bold}.muted{color:#9aa8c2}.nav{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.nav button{background:#1e293b}.nav button.active{background:#2563eb}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #263452;text-align:right;vertical-align:top}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#1e293b;font-size:12px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}input,select,textarea{background:#0b1222;border:1px solid #334155;color:#fff;border-radius:8px;padding:9px;width:100%}textarea{min-height:130px;direction:ltr}.actions{display:flex;gap:6px;flex-wrap:wrap}.login{max-width:420px;margin:12vh auto}.hidden{display:none}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.notice{padding:10px;border-radius:9px;background:#172554;margin:10px 0}.log{direction:ltr;text-align:left;white-space:pre-wrap;max-height:360px;overflow:auto;background:#050812;padding:12px;border-radius:8px;font-family:monospace;font-size:12px}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s), api=async(u,o={})=>{const r=await fetch(u,{...o,headers:{'content-type':'application/json',...(o.headers||{})}});const j=await r.json();if(r.status===401){showLogin();throw Error('auth')}if(!r.ok)throw Error(j.error||'request failed');return j};
let state={tab:'dashboard',inbounds:[],clients:[],status:null};
function showLogin(){app.innerHTML='<div class="wrap login"><div class="card"><h2>Xray Panel v7</h2><p class="muted">ورود مدیریت</p><div class="field"><label>نام کاربری</label><input id="lu" value="admin"></div><br><div class="field"><label>رمز عبور</label><input id="lp" type="password" value="admin"></div><br><button class="primary" onclick="login()">ورود</button><div id="le" class="notice hidden"></div></div></div>'}async function login(){try{await api('/api/login',{method:'POST',body:JSON.stringify({username:lu.value,password:lp.value})});load()}catch(e){le.textContent=e.message;le.classList.remove('hidden')}}
async function load(){try{state.status=await api('/api/status');state.inbounds=await api('/api/inbounds');state.clients=await api('/api/clients');render()}catch(e){if(e.message!=='auth')showLogin()}}
function render(){app.innerHTML=`<div class="wrap"><div class="top"><div><h1>Xray Panel v7</h1><div class="muted">مدیریت مستقل Xray / Railway</div></div><div class="actions"><button onclick="logout()">خروج</button></div></div><div class="nav">${['dashboard','inbounds','clients','config','logs','settings'].map(x=>`<button class="${state.tab===x?'active':''}" onclick="state.tab='${x}';render()">${({dashboard:'داشبورد',inbounds:'Inbound ها',clients:'Client ها',config:'Config',logs:'لاگ',settings:'تنظیمات'})[x]}</button>`).join('')}</div><div id="content"></div></div>`;const f={dashboard:dashboard,inbounds:inbounds,clients:clients,config:config,logs:logs,settings:settings}[state.tab];f()}
function dashboard(){content.innerHTML=`<div class="grid"><div class="card"><div class="muted">Xray</div><div class="stat">${state.status.xray.running?'Running':'Stopped'}</div><button class="ok" onclick="xr('start')">Start</button> <button class="danger" onclick="xr('stop')">Stop</button> <button onclick="xr('restart')">Restart</button></div><div class="card"><div class="muted">Inbound</div><div class="stat">${state.status.counts.inbounds}</div></div><div class="card"><div class="muted">Clients</div><div class="stat">${state.status.counts.clients}</div></div><div class="card"><div class="muted">Public host</div><div>${state.status.host}</div></div></div><div class="card"><h3>پورت‌ها</h3><p>Panel: <b>${state.status.ports.panel}</b> — Gateway: <b>${state.status.ports.gateway}</b></p><p class="muted">Gateway مسیرهای HTTP/WebSocket را به listener داخلی Xray می‌فرستد.</p></div>`}
function inbounds(){content.innerHTML=`<div class="card"><div class="row"><h2>Inbound Manager</h2><button class="primary" onclick="newInbound()">+ Inbound</button></div><table><thead><tr><th>نام</th><th>Protocol</th><th>Transport</th><th>Security</th><th>Internal Port</th><th>Path</th><th>عملیات</th></tr></thead><tbody>${state.inbounds.map(i=>`<tr><td>${esc(i.name)}</td><td><span class="pill">${i.protocol}</span></td><td>${i.network}</td><td>${i.security}</td><td>${i.port}</td><td dir="ltr">${esc(i.path)}</td><td><button onclick="editInbound('${i.id}')">ویرایش</button> <button class="danger" onclick="delInbound('${i.id}')">حذف</button></td></tr>`).join('')}</tbody></table></div>`}
function newInbound(i={}){content.innerHTML=`<div class="card"><h2>${i.id?'ویرایش':'Inbound جدید'}</h2><div class="form"><div class="field"><label>نام</label><input id="in_name" value="${esc(i.name||'VLESS WS')}"></div><div class="field"><label>Protocol</label><select id="in_protocol"><option ${i.protocol==='vless'||!i.protocol?'selected':''}>vless</option><option ${i.protocol==='vmess'?'selected':''}>vmess</option><option ${i.protocol==='trojan'?'selected':''}>trojan</option><option ${i.protocol==='shadowsocks'?'selected':''}>shadowsocks</option></select></div><div class="field"><label>Transport</label><select id="in_network"><option value="ws" ${i.network==='ws'||!i.network?'selected':''}>WebSocket</option><option value="httpupgrade" ${i.network==='httpupgrade'?'selected':''}>HTTPUpgrade</option><option value="grpc" ${i.network==='grpc'?'selected':''}>gRPC</option><option value="tcp" ${i.network==='tcp'?'selected':''}>TCP</option></select></div><div class="field"><label>Security</label><select id="in_security"><option value="none" ${i.security==='none'||!i.security?'selected':''}>None</option><option value="tls" ${i.security==='tls'?'selected':''}>TLS</option><option value="reality" ${i.security==='reality'?'selected':''}>REALITY</option></select></div><div class="field"><label>Path / Service</label><input id="in_path" dir="ltr" value="${esc(i.path||'/api/ws')}"></div><div class="field"><label>Internal port</label><input id="in_port" type="number" value="${i.port||''}" placeholder="خالی = خودکار"></div><div class="field full"><label>Advanced JSON</label><textarea id="in_adv">${esc(JSON.stringify(i.config||{},null,2))}</textarea></div></div><br><div class="actions"><button class="primary" onclick="saveInbound('${i.id||''}')">ذخیره و Restart Xray</button><button onclick="state.tab='inbounds';render()">انصراف</button></div></div>`}
async function saveInbound(id){let adv={};try{adv=JSON.parse(in_adv.value||'{}')}catch(e){return alert('JSON نامعتبر است')}const b={name:in_name.value,protocol:in_protocol.value,network:in_network.value,security:in_security.value,path:in_path.value,port:Number(in_port.value||0),advanced:adv};if(id)await api('/api/inbounds/'+id,{method:'PUT',body:JSON.stringify(b)});else await api('/api/inbounds',{method:'POST',body:JSON.stringify(b)});await load()}
function editInbound(id){newInbound(state.inbounds.find(x=>x.id===id))}async function delInbound(id){if(confirm('حذف شود؟')){await api('/api/inbounds/'+id,{method:'DELETE'});await load()}}
function clients(){content.innerHTML=`<div class="card"><div class="row"><h2>Client Manager</h2><button class="primary" onclick="newClient()">+ Client</button></div><table><thead><tr><th>Email</th><th>Protocol</th><th>UUID/Password</th><th>Inbound ها</th><th>Link/QR</th><th>عملیات</th></tr></thead><tbody>${state.clients.map(c=>`<tr><td>${esc(c.email)}</td><td>${c.protocol}</td><td dir="ltr">${esc(c.uuid||c.password)}</td><td>${c.inbounds.length}</td><td><button onclick="showLinks('${c.id}')">Links</button> <button onclick="qr('${c.id}')">QR</button></td><td><button onclick="editClient('${c.id}')">ویرایش</button> <button class="danger" onclick="delClient('${c.id}')">حذف</button></td></tr>`).join('')}</tbody></table></div>`}
function newClient(c={}){content.innerHTML=`<div class="card"><h2>${c.id?'ویرایش':'Client جدید'}</h2><div class="form"><div class="field"><label>Email/Name</label><input id="cl_email" value="${esc(c.email||'client')}"></div><div class="field"><label>Protocol</label><select id="cl_protocol"><option>vless</option><option ${c.protocol==='vmess'?'selected':''}>vmess</option><option ${c.protocol==='trojan'?'selected':''}>trojan</option><option ${c.protocol==='shadowsocks'?'selected':''}>shadowsocks</option></select></div><div class="field"><label>UUID</label><input id="cl_uuid" dir="ltr" value="${esc(c.uuid||'')}"></div><div class="field"><label>Password (Trojan/SS)</label><input id="cl_password" dir="ltr" value="${esc(c.password||'')}"></div><div class="field"><label>Flow</label><input id="cl_flow" dir="ltr" value="${esc(c.flow||'')}"></div><div class="field"><label>Expiry timestamp (0=no expiry)</label><input id="cl_expiry" type="number" value="${c.expiry||0}"></div><div class="field full"><label>اتصال به Inbound ها</label><div>${state.inbounds.map(i=>`<label style="display:block"><input class="ib" type="checkbox" value="${i.id}" ${(c.inbounds||[]).includes(i.id)?'checked':''}> ${esc(i.name)} — ${i.network} ${i.path}</label>`).join('')}</div></div></div><br><button class="primary" onclick="saveClient('${c.id||''}')">ذخیره و Restart Xray</button> <button onclick="state.tab='clients';render()">انصراف</button></div>`}
async function saveClient(id){const inbounds=[...document.querySelectorAll('.ib:checked')].map(x=>x.value);const b={email:cl_email.value,protocol:cl_protocol.value,uuid:cl_uuid.value||undefined,password:cl_password.value||undefined,flow:cl_flow.value,expiry:Number(cl_expiry.value||0),inbounds};if(id)await api('/api/clients/'+id,{method:'PUT',body:JSON.stringify(b)});else await api('/api/clients',{method:'POST',body:JSON.stringify(b)});await load()}
function editClient(id){newClient(state.clients.find(x=>x.id===id))}async function delClient(id){if(confirm('حذف شود؟')){await api('/api/clients/'+id,{method:'DELETE'});await load()}}
async function showLinks(id){const x=await api('/api/subscribe?client='+id);content.innerHTML=`<div class="card"><h2>Client Links</h2><textarea style="height:300px">${esc(x.links.join('\n'))}</textarea><p class="muted">Subscription Base64:</p><textarea style="height:130px">${esc(x.base64)}</textarea><button onclick="state.tab='clients';render()">بازگشت</button></div>`}async function qr(id){const x=await api('/api/qr?client='+id);content.innerHTML=`<div class="card" style="text-align:center"><h2>QR</h2><img src="${x.qr}" style="max-width:360px;background:white;padding:10px"><p dir="ltr">${esc(x.data)}</p><button onclick="state.tab='clients';render()">بازگشت</button></div>`}
async function config(){const x=await api('/api/xray/config');content.innerHTML=`<div class="card"><div class="row"><h2>Generated Xray JSON</h2><button onclick="navigator.clipboard.writeText(JSON.stringify(${JSON.stringify(x)},null,2))">کپی</button></div><textarea style="height:650px">${esc(JSON.stringify(x,null,2))}</textarea></div>`}
async function logs(){const x=await api('/api/status');content.innerHTML=`<div class="card"><h2>Xray Logs</h2><div class="log">${esc(x.logs.join('\n'))}</div></div>`}
function settings(){content.innerHTML=`<div class="card"><h2>Settings</h2><p>رمز پیش‌فرض admin است؛ بعد از ورود آن را عوض کنید.</p><div class="field"><label>رمز جدید (حداقل ۸ کاراکتر)</label><input id="np" type="password"></div><br><button class="primary" onclick="changePass()">تغییر رمز</button><hr><h3>Backup</h3><button onclick="backup()">Export JSON</button> <button onclick="restore()">Import JSON</button></div>`}async function changePass(){await api('/api/settings/password',{method:'POST',body:JSON.stringify({password:np.value})});alert('رمز تغییر کرد')}async function backup(){const x=await api('/api/backup');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(x,null,2)],{type:'application/json'}));a.download='xray-panel-backup.json';a.click()}function restore(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{const x=JSON.parse(await i.files[0].text());await api('/api/backup',{method:'POST',body:JSON.stringify(x)});await load()};i.click()}
async function xr(a){await api('/api/xray/'+a,{method:'POST'});await load()}async function logout(){await api('/api/logout');showLogin()}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
load();setInterval(()=>{if(state.tab==='dashboard'||state.tab==='logs')load()},8000);
</script></body></html>
